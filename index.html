<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crew Clues</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Work+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap">
<style>
  :root {
    --bg-1: #180f33;
    --bg-2: #442380;
    --panel: #241a4d;
    --panel-2: #2c2058;
    --panel-line: rgba(255,255,255,0.10);
    --text: #f6f3ff;
    --text-dim: rgba(246,243,255,0.66);
    --text-faint: rgba(246,243,255,0.42);
    --accent: #ffb648;
    --accent-ink: #2a1604;
    --accent-2: #ff5d8f;
    --good: #2fe0ac;
    --shadow: rgba(6,3,20,0.55);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    background: radial-gradient(circle at 50% 10%, var(--bg-2), var(--bg-1) 62%);
    background-attachment: fixed;
    color: var(--text);
    font-family: 'Work Sans', system-ui, sans-serif;
    padding: 24px 20px 60px;
  }
  h1, h2, h3, .display { font-family: 'Fredoka', 'Work Sans', system-ui, sans-serif; text-wrap: balance; }
  .tnum { font-family: 'Space Mono', 'Courier New', monospace; font-variant-numeric: tabular-nums; }
  .wrap { max-width: 1180px; margin: 0 auto; }
  button {
    font-family: inherit;
    font-weight: 700;
    font-size: 1rem;
    padding: 13px 26px;
    border: none;
    border-radius: 999px;
    cursor: pointer;
    background: linear-gradient(135deg, var(--accent-2), var(--accent));
    color: var(--accent-ink);
    box-shadow: 0 8px 20px var(--shadow);
    transition: transform .15s ease, box-shadow .15s ease, opacity .15s ease;
  }
  button:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 12px 26px var(--shadow); }
  button:active:not(:disabled) { transform: translateY(0); }
  button:disabled { opacity: .4; cursor: not-allowed; }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  button.ghost {
    background: rgba(255,255,255,.08);
    color: var(--text);
    border: 2px solid var(--panel-line);
    box-shadow: none;
  }
  button.danger-ghost {
    background: rgba(255,93,143,.12);
    color: var(--accent-2);
    border: 2px solid rgba(255,93,143,.35);
    box-shadow: none;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--panel-line);
    border-radius: 18px;
    padding: 20px 22px;
    box-shadow: 0 14px 34px var(--shadow);
  }
  .eyebrow {
    font-size: .78rem;
    font-weight: 700;
    letter-spacing: .09em;
    text-transform: uppercase;
    color: var(--text-faint);
    margin: 0 0 6px;
  }
  .top { text-align: center; margin-bottom: 22px; }
  .top h1 { font-size: clamp(1.7rem, 4vw, 2.4rem); margin: 0 0 6px; font-weight: 700; }
  .top p { color: var(--text-dim); max-width: 620px; margin: 0 auto; font-size: .98rem; }
  .role-switch {
    display: inline-block; margin-top: 10px; font-size: .82rem; color: var(--text-faint);
    background: none; border: 1px solid var(--panel-line); padding: 6px 14px; border-radius: 999px;
    box-shadow: none; cursor: pointer; font-weight: 600;
  }
  .role-switch:hover { color: var(--text); border-color: var(--accent-2); transform: none; }

  .host-login-form {
    display: none; gap: 8px; margin-top: 10px; justify-content: center; align-items: center; flex-wrap: wrap;
  }
  .host-login-form.show { display: flex; }
  .host-login-form input {
    padding: 9px 12px; border-radius: 999px; border: 1px solid var(--panel-line);
    background: var(--panel-2); color: var(--text); font-family: inherit; font-size: .9rem; width: 180px;
  }
  .host-login-form button { padding: 9px 18px; font-size: .88rem; }

  /* ---------- host: the screen-share part ---------- */
  body.host-mode { padding: 16px 24px; }
  body.host-mode .wrap { max-width: 1760px; }
  body.host-mode::before, body.host-mode::after {
    content: ""; position: fixed; z-index: -1; border-radius: 50%; filter: blur(90px); pointer-events: none;
  }
  body.host-mode::before { width: 42vmax; height: 42vmax; left: -14vmax; top: -12vmax; background: rgba(255,93,143,.22); }
  body.host-mode::after { width: 46vmax; height: 46vmax; right: -16vmax; bottom: -18vmax; background: rgba(255,182,72,.16); }

  .presenter {
    --wheel: clamp(240px, calc(100vh - 304px - 5vh), 46vw);
    --wheel: clamp(240px, calc(100dvh - 304px - 5dvh), 46vw);
    min-height: calc(100vh - 32px);
    min-height: calc(100dvh - 32px);
    display: grid; grid-template-rows: auto auto 1fr; gap: 12px;
  }

  .brand { display: flex; align-items: center; justify-content: center; gap: 18px; }
  .brand h1 { margin: 0; font-size: clamp(2rem, 6vh, 3.6rem); line-height: 1; letter-spacing: .01em; font-weight: 700; }
  .brand .t-grad {
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .brand .t-emoji { font-size: clamp(2rem, 6vh, 3.6rem); line-height: 1; }

  .round-card {
    text-align: center; display: flex; flex-direction: column; justify-content: center; gap: 4px;
    min-height: 84px; padding: 12px 28px; width: 100%;
    background: linear-gradient(135deg, rgba(255,93,143,.16), rgba(255,182,72,.12)), var(--panel);
    border-color: rgba(255,182,72,.3);
  }
  .round-card .status { font-weight: 700; font-size: clamp(1.3rem, 3.2vh, 2rem); font-family: 'Fredoka', 'Work Sans', system-ui, sans-serif; }
  .round-card .fact {
    font-style: italic; color: var(--text-dim); font-size: clamp(.95rem, 2.2vh, 1.35rem); min-height: 1.3em;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }

  .presenter-grid {
    display: grid; grid-template-columns: 1fr auto 1fr; gap: 28px; align-items: stretch; min-height: 0;
  }
  .side-card {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; gap: clamp(14px, 3vh, 26px); padding: 24px;
  }
  .side-card .eyebrow { font-size: clamp(.85rem, 2vh, 1.15rem); margin: 0; color: var(--accent); }

  .steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: clamp(12px, 3vh, 28px); width: 100%; }
  .step { display: grid; grid-template-columns: auto 1fr; gap: 16px; align-items: center; text-align: left; }
  .step .ico {
    width: clamp(52px, 9vh, 78px); height: clamp(52px, 9vh, 78px);
    display: flex; align-items: center; justify-content: center;
    font-size: clamp(1.7rem, 4.6vh, 2.7rem); border-radius: 20px;
    background: rgba(255,255,255,.07); border: 1px solid var(--panel-line);
  }
  .step b { display: block; font-family: 'Fredoka', 'Work Sans', system-ui, sans-serif; font-size: clamp(1.05rem, 2.6vh, 1.5rem); font-weight: 600; }
  .step span { color: var(--text-dim); font-size: clamp(.85rem, 2vh, 1.1rem); line-height: 1.35; }

  .stage { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
  .wheel-wrap { position: relative; width: var(--wheel); height: var(--wheel); margin: 20px; }
  .bulbs { position: absolute; inset: 0; pointer-events: none; }
  .bulb {
    position: absolute; left: 50%; top: 50%; width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 50%;
    background: #ffd98a; box-shadow: 0 0 10px 3px rgba(255,182,72,.75);
    transform: rotate(var(--a)) translateY(calc(var(--wheel) / -2 - 15px));
    animation: twinkle 1.6s ease-in-out infinite;
  }
  .bulb:nth-child(even) { animation-delay: .8s; background: #ff9ec0; box-shadow: 0 0 10px 3px rgba(255,93,143,.7); }
  @keyframes twinkle { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
  @media (prefers-reduced-motion: reduce) { .bulb { animation: none; } }

  .pointer {
    position: absolute; top: -26px; left: 50%; transform: translateX(-50%);
    width: 0; height: 0;
    border-left: 24px solid transparent; border-right: 24px solid transparent;
    border-top: 42px solid var(--accent);
    z-index: 5; filter: drop-shadow(0 3px 6px var(--shadow));
  }
  /* The rim/glow sits on a fixed layer; only the clipped canvas inside it rotates, so its
     corners can never poke past the page edge and flicker a scrollbar in and out mid-spin. */
  .wheel-rim {
    position: absolute; inset: 0; border-radius: 50%;
    box-shadow: 0 0 0 clamp(6px, 1.2vh, 12px) var(--panel-2), 0 0 56px rgba(255,182,72,.28), 0 20px 46px var(--shadow);
  }
  .wheel-clip { position: absolute; inset: 0; border-radius: 50%; overflow: hidden; }
  canvas#wheel {
    width: 100%; height: 100%; display: block;
    transition: transform 4.6s cubic-bezier(.17,.67,.12,.99);
  }
  .hub {
    position: absolute; top: 50%; left: 50%; width: 17%; height: 17%;
    transform: translate(-50%,-50%);
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    border-radius: 50%; box-shadow: 0 0 0 5px var(--bg-1), 0 4px 14px var(--shadow);
    display: flex; align-items: center; justify-content: center; font-size: calc(var(--wheel) * .085);
  }
  .stage-controls { display: flex; gap: 16px; justify-content: center; }
  .stage-controls button {
    min-width: clamp(170px, 17vw, 260px); padding: 14px 20px; font-size: clamp(1rem, 2.4vh, 1.3rem);
  }

  .qr-box {
    background: #fff; border-radius: 18px; padding: 14px; aspect-ratio: 1;
    width: min(100%, calc(100dvh - 430px), 440px); min-width: 200px;
    box-shadow: 0 0 0 6px rgba(255,255,255,.08), 0 0 44px rgba(255,182,72,.25);
  }
  .qr-box img, .qr-box canvas { width: 100% !important; height: 100% !important; display: block; }
  .qr-url {
    font-family: 'Space Mono', 'Courier New', monospace; font-size: clamp(.78rem, 1.8vh, 1rem);
    color: var(--text-dim); overflow-wrap: anywhere;
  }
  .qr-hint { color: var(--text-dim); font-size: clamp(.9rem, 2vh, 1.15rem); }

  @media (max-width: 1000px) {
    .presenter { --wheel: min(86vw, 60vh); grid-template-rows: auto auto auto; }
    .presenter-grid { grid-template-columns: 1fr; }
    .stage { order: -1; }
    .qr-box { width: min(100%, 320px); }
  }

  .host-toggle {
    position: fixed; left: 14px; top: 14px; z-index: 400;
    padding: 6px 12px; font-size: .78rem; font-weight: 600;
    background: rgba(255,255,255,.05); color: var(--text-faint);
    border: 1px solid var(--panel-line); box-shadow: none; opacity: .55;
  }
  .host-toggle:hover:not(:disabled), .host-toggle:focus-visible { opacity: 1; color: var(--text); transform: none; box-shadow: none; }
  .music-toggle { left: auto; right: 14px; }
  [hidden] { display: none !important; }

  /* ---------- host: below the fold ---------- */
  .admin { margin-top: 36px; padding-top: 28px; border-top: 1px dashed var(--panel-line); }
  .admin h2 { margin: 0 0 4px; font-size: 1.5rem; }
  .admin .admin-note { color: var(--text-dim); font-size: .9rem; margin-bottom: 20px; }
  .admin-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 18px; align-items: start;
  }
  .admin-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
  .admin-actions button { padding: 10px 18px; font-size: .92rem; }

  .week-card .bar {
    height: 10px; border-radius: 999px; background: rgba(255,255,255,.08); overflow: hidden; margin-top: 10px;
  }
  .week-card .bar-fill { height: 100%; background: linear-gradient(90deg, var(--accent-2), var(--accent)); }
  .week-card .counts { display: flex; justify-content: space-between; font-size: .85rem; color: var(--text-dim); margin-top: 6px; }

  .board-list { list-style: none; margin: 10px 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .board-row {
    display: flex; align-items: center; gap: 10px; font-size: .95rem;
    padding: 8px 10px; border-radius: 10px; background: rgba(255,255,255,.04);
  }
  .board-row .rank { width: 1.4em; color: var(--text-faint); font-weight: 700; }
  .board-row .who { flex: 1; font-weight: 600; }
  .board-row .score { color: var(--accent); font-weight: 700; }
  .board-row .prize { font-size: .82rem; color: var(--good); font-weight: 600; }
  .board-empty { color: var(--text-faint); font-size: .9rem; margin-top: 8px; }

  /* ---------- guest ---------- */
  .guest-wrap { max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
  .identity-row { display: flex; gap: 10px; align-items: center; }
  .identity-row select {
    flex: 1; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--panel-line);
    background: var(--panel-2); color: var(--text); font-family: inherit; font-size: 1rem;
  }
  .whoami { font-size: .9rem; color: var(--text-dim); display: flex; align-items: center; gap: 8px; }
  .whoami button { padding: 6px 14px; font-size: .82rem; }

  .fact-banner { text-align: center; }
  .fact-banner .status { font-weight: 700; font-size: 1.2rem; margin-bottom: 6px; }
  .fact-banner .fact-text { font-style: italic; font-size: 1.12rem; line-height: 1.4; }
  .fact-banner .sub { color: var(--text-dim); font-size: .9rem; margin-top: 10px; }

  .guess-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .guess-btn {
    background: var(--panel-2); color: var(--text); border: 2px solid var(--panel-line);
    border-radius: 14px; padding: 14px 8px; font-weight: 700; font-size: 1rem;
    box-shadow: none;
  }
  .guess-btn:hover:not(:disabled) { border-color: var(--accent-2); transform: translateY(-2px); }

  .reveal { text-align: center; padding: 10px 0; }
  .reveal .name {
    font-size: clamp(1.7rem, 7vw, 2.6rem); font-weight: 700; font-family: 'Fredoka', sans-serif;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
    margin: 6px 0;
  }

  .empty-note { text-align: center; color: var(--text-dim); padding: 30px 10px; }
  .empty-note .big { font-size: 2.2rem; margin-bottom: 8px; }

  .overlay {
    position: fixed; inset: 0; background: rgba(8,5,20,.82); backdrop-filter: blur(3px);
    display: flex; align-items: center; justify-content: center; z-index: 500;
    opacity: 0; pointer-events: none; transition: opacity .25s ease; padding: 20px;
  }
  .overlay.show { opacity: 1; pointer-events: auto; }
  .edit-card {
    background: var(--panel); border-radius: 18px; padding: 24px 26px; max-width: 560px; width: 100%;
    max-height: 86vh; display: flex; flex-direction: column; box-shadow: 0 24px 60px var(--shadow);
  }
  .edit-card h2 { margin: 0 0 4px; }
  .edit-card .hint { color: var(--text-dim); font-size: .88rem; margin-bottom: 14px; }
  .edit-scroll { overflow-y: auto; display: flex; flex-direction: column; gap: 12px; padding-right: 6px; }
  .fact-row { background: rgba(255,255,255,.04); border-radius: 12px; padding: 12px 14px; }
  .fact-row .name { font-weight: 700; margin-bottom: 8px; }
  .fact-row input {
    width: 100%; margin-top: 6px; padding: 8px 10px; border-radius: 8px;
    border: 1px solid var(--panel-line); background: var(--panel-2); color: var(--text);
    font-family: inherit; font-size: .92rem;
  }
  .fact-row input::placeholder { color: var(--text-faint); }
  .edit-actions { display: flex; gap: 12px; justify-content: flex-end; margin-top: 16px; }

  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--panel-2); border: 1px solid var(--panel-line); color: var(--text);
    padding: 12px 20px; border-radius: 12px; font-size: .92rem; opacity: 0; pointer-events: none;
    transition: opacity .25s ease, transform .25s ease; z-index: 600; box-shadow: 0 10px 26px var(--shadow);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .confetti { position: fixed; top: -10px; width: 9px; height: 9px; z-index: 999; pointer-events: none; border-radius: 2px; }
  @keyframes fall { to { transform: translateY(110vh) rotate(720deg); opacity: .25; } }
  @media (prefers-reduced-motion: reduce) { .confetti { display: none; } button { transition: none; } }

  .loading-note { text-align: center; color: var(--text-dim); padding: 60px 20px; }

  /* ---------- round timer, live guessing log, story time ---------- */
  .round-card { position: relative; padding: 12px 150px 16px; }
  .round-timer {
    position: absolute; right: 22px; top: 50%; transform: translateY(-50%);
    font-family: 'Space Mono', 'Courier New', monospace; font-weight: 700; font-size: clamp(1.2rem, 3vh, 2rem);
    font-variant-numeric: tabular-nums; white-space: nowrap;
    padding: 6px 16px; border-radius: 999px; background: rgba(0,0,0,.28);
    border: 1px solid rgba(255,182,72,.45); color: var(--accent);
  }
  .round-timer.urgent { color: #fff; background: rgba(255,93,143,.55); border-color: var(--accent-2); animation: timerPulse 1s ease-in-out infinite; }
  .round-timer.story { font-family: 'Fredoka', 'Work Sans', system-ui, sans-serif; color: var(--good); border-color: rgba(47,224,172,.5); }
  @keyframes timerPulse { 50% { transform: translateY(-50%) scale(1.07); } }
  .timer-bar { position: absolute; left: 18px; right: 18px; bottom: 6px; height: 5px; border-radius: 999px; background: rgba(255,255,255,.1); overflow: hidden; }
  .timer-bar i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, var(--accent-2), var(--accent)); transition: width .3s linear; }

  .left-card { position: relative; }
  .pane { width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: clamp(14px, 3vh, 26px); }
  .guesslog { position: absolute; inset: 22px; width: auto; align-items: stretch; justify-content: flex-start; gap: 12px; }
  .log-head { display: flex; align-items: center; justify-content: center; gap: 10px; }
  .log-head .eyebrow { color: var(--accent); font-size: clamp(.85rem, 2vh, 1.15rem); margin: 0; }
  .live-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--good); box-shadow: 0 0 10px 2px rgba(47,224,172,.7); animation: twinkle 1.2s ease-in-out infinite; }
  .log-count { font-family: 'Space Mono', 'Courier New', monospace; font-size: .8rem; background: rgba(255,255,255,.1); border-radius: 999px; padding: 2px 9px; color: var(--text-dim); }
  .log-list { list-style: none; margin: 0; padding: 0 4px 0 0; flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; scrollbar-width: thin; }
  .log-item {
    display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 16px;
    background: rgba(255,255,255,.06); border: 1px solid var(--panel-line); font-size: clamp(.9rem, 2vh, 1.15rem);
  }
  .log-item:last-child { animation: popIn .25s ease-out; }
  .log-item .av {
    flex: none; width: clamp(28px, 4.4vh, 38px); height: clamp(28px, 4.4vh, 38px); border-radius: 50%;
    display: flex; align-items: center; justify-content: center; font-family: 'Fredoka', sans-serif; font-weight: 700; color: #180f33;
  }
  .log-item .msg { flex: 1; min-width: 0; overflow-wrap: anywhere; text-align: left; }
  .log-item .msg em { font-style: normal; font-weight: 700; color: var(--accent); }
  .log-item.first { border-color: rgba(255,182,72,.7); background: rgba(255,182,72,.14); }
  .log-item .badge { flex: none; font-size: .78rem; font-weight: 700; color: var(--accent); }
  .log-empty { color: var(--text-faint); text-align: center; padding: 18px 8px; font-size: .95rem; }
  @keyframes popIn { from { opacity: 0; transform: translateY(8px) scale(.97); } }

  .guest-timer {
    display: inline-block; font-family: 'Space Mono', 'Courier New', monospace; font-weight: 700; font-variant-numeric: tabular-nums;
    color: var(--accent); background: rgba(255,182,72,.12); border: 1px solid rgba(255,182,72,.4);
    border-radius: 999px; padding: 4px 14px; margin-bottom: 10px;
  }
  .guest-timer.urgent { color: #fff; background: rgba(255,93,143,.5); border-color: var(--accent-2); }

  @media (max-width: 1000px) {
    .round-card { padding: 12px 20px 16px; }
    .round-timer { position: static; transform: none; align-self: center; margin-top: 6px; animation: none; }
    .guesslog { position: static; min-height: 260px; }
  }
  @media (prefers-reduced-motion: reduce) { .round-timer.urgent, .live-dot, .log-item:last-child { animation: none; } }
</style>
</head>

// ===================== SMALL HELPERS =====================
const $ = id => document.getElementById(id);

let toastTimer = null;
function toast(msg) {
  const el = $('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 3200);
}

function launchConfetti() {
  for (let i = 0; i < 50; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = Math.random() * 100 + 'vw';
    c.style.background = WHEEL_COLORS[Math.floor(Math.random() * WHEEL_COLORS.length)];
    c.style.animation = `fall ${2 + Math.random() * 1.4}s linear forwards`;
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 3800);
  }
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function fmtClock(secs) {
  const s = Math.max(0, Math.ceil(secs));
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
}

// round ids are 'r' + the host's clock at the moment guessing opened
function roundStartFromId(id) {
  const n = parseInt(String(id).replace(/\D/g, ''), 10);
  return Number.isFinite(n) ? n : Date.now();
}

// Stable pseudo-random order for the wheel. It depends only on the name and this week's
// shuffle stamp, so slices never line up with the roster order and never move between redraws.
function hashStr(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}

function orderedRemaining() {
  const seed = latestWeekStatus.seed || '';
  return latestWeekStatus.remaining.slice().sort((a, b) =>
    hashStr(a + '|' + seed) - hashStr(b + '|' + seed) || a.localeCompare(b));
}

// ===================== SOUND =====================
// Everything is generated in the browser (no audio files): wheel clicks, a bell on landing,
// a light "thinking" loop while guesses are open, and a buzzer when time runs out.
const Music = (() => {
  let ctx = null, master = null, fx = null, timer = null, nextTime = 0, step = 0;
  let enabled = localStorage.getItem('cc.music') !== 'off';
  const STEP = (60 / 104) / 2;
  const hz = n => 440 * Math.pow(2, (n - 69) / 12);
  const MEL = [69,72,76,72, 74,72,67,72, 69,72,76,79, 76,74,72,69];
  const BASS = [45,0,52,0, 50,0,43,0, 45,0,52,0, 48,0,43,0];

  function tone(freq, t, dur, type, vol) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + dur + 0.05);
  }
  function schedule() {
    while (nextTime < ctx.currentTime + 0.35) {
      const i = step % 16;
      tone(hz(MEL[i]), nextTime, STEP * 1.7, 'triangle', 0.22);
      if (BASS[i]) tone(hz(BASS[i]), nextTime, STEP * 3.4, 'sine', 0.34);
      if (i % 2 === 0) tone(1900, nextTime, 0.04, 'square', 0.03);
      nextTime += STEP; step++;
    }
  }
  const live = () => enabled && ctx && ctx.state === 'running';
  return {
    unlock() {
      if (!ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        ctx = new AC();
        master = ctx.createGain();
        master.gain.value = 0.5;
        master.connect(ctx.destination);
        fx = ctx.createGain();
        fx.gain.value = 0.7;
        fx.connect(ctx.destination);
      }
      if (ctx.state === 'suspended') ctx.resume();
    },
    start() {
      if (!enabled || !ctx || timer) return;
      master.gain.cancelScheduledValues(ctx.currentTime);
      master.gain.setValueAtTime(0.5, ctx.currentTime);
      step = 0; nextTime = ctx.currentTime + 0.05;
      schedule();
      timer = setInterval(schedule, 100);
    },
    stop() {
      if (!timer) return;
      clearInterval(timer); timer = null;
      master.gain.cancelScheduledValues(ctx.currentTime);
      master.gain.setValueAtTime(master.gain.value, ctx.currentTime);
      master.gain.linearRampToValueAtTime(0.0001, ctx.currentTime + 0.4);
    },
    tick() {
      if (!live()) return;
      const t = ctx.currentTime, o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'triangle';
      o.frequency.setValueAtTime(1500 + Math.random() * 200, t);
      o.frequency.exponentialRampToValueAtTime(800, t + 0.03);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.5, t + 0.002);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
      o.connect(g); g.connect(fx);
      o.start(t); o.stop(t + 0.07);
    },
    ding() {
      if (!live()) return;
      const t = ctx.currentTime;
      [[880, 0.5], [1320, 0.28], [1760, 0.14]].forEach(([f, v]) => {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = 'sine'; o.frequency.value = f;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(v, t + 0.01);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 1.1);
        o.connect(g); g.connect(fx);
        o.start(t); o.stop(t + 1.2);
      });
    },
    buzz() {
      if (!live()) return;
      const t = ctx.currentTime;
      [0, 0.3].forEach(d => {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = 'sawtooth'; o.frequency.value = 170;
        g.gain.setValueAtTime(0.0001, t + d);
        g.gain.exponentialRampToValueAtTime(0.35, t + d + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t + d + 0.24);
        o.connect(g); g.connect(fx);
        o.start(t + d); o.stop(t + d + 0.3);
      });
    },
    setEnabled(on) { enabled = on; localStorage.setItem('cc.music', on ? 'on' : 'off'); if (!on) this.stop(); },
    isEnabled() { return enabled; },
    isPlaying() { return !!timer; },
  };
})();

let spinTicksRAF = null;
function startSpinTicks(canvas, sliceAngle) {
  const angleOf = () => {
    const m = getComputedStyle(canvas).transform;
    const v = m && m.match(/matrix\(([^)]+)\)/);
    if (!v) return 0;
    const [a, b] = v[1].split(',').map(Number);
    return (Math.atan2(b, a) * 180 / Math.PI + 360) % 360;
  };
  let last = angleOf(), total = 0, lastSlice = 0;
  const loop = () => {
    const a = angleOf();
    total += ((a - last + 540) % 360) - 180;
    last = a;
    const slice = Math.floor(total / sliceAngle);
    if (slice !== lastSlice) { Music.tick(); lastSlice = slice; }
    spinTicksRAF = requestAnimationFrame(loop);
  };
  spinTicksRAF = requestAnimationFrame(loop);
}
function stopSpinTicks() {
  if (spinTicksRAF !== null) { cancelAnimationFrame(spinTicksRAF); spinTicksRAF = null; }
}

// ===================== ROLE / BOOT =====================
async function hostLogin(passcode) {
  const { error } = await sb.auth.signInWithPassword({ email: HOST_EMAIL, password: passcode });
  if (error) { toast("Wrong passcode."); return false; }
  return true;
}
async function hostLogout() {
  await sb.auth.signOut();
}

function resetHostRuntime() {
  Music.stop();
  stopSpinTicks();
  stopRoundTimer();
  clearInterval(guestTimerInt); guestTimerInt = null; guestRoundKey = null;
  clearChannels();
  if (unsubGuesses) { unsubGuesses(); unsubGuesses = null; }
  phase = 'idle'; hostSpinning = false; currentRound = null;
}

async function boot() {
  const { data: { session } } = await sb.auth.getSession();
  isHost = !!session;

  // Deferred with setTimeout: supabase-js holds an auth lock while this callback runs, so
  // starting new queries synchronously in here can deadlock.
  sb.auth.onAuthStateChange((_event, session) => {
    const nowHost = !!session;
    if (nowHost === isHost) return;
    setTimeout(() => {
      resetHostRuntime();
      isHost = nowHost;
      if (isHost) initHost(); else initGuest();
    }, 0);
  });

  if (isHost) initHost(); else initGuest();
}
boot();

}

// ---------- left card: How to play <-> Live Guessing Log ----------
function showGuessLog(on) {
  const howTo = $('howTo'), log = $('guessLog');
  if (!howTo || !log) return;
  howTo.hidden = on;
  log.hidden = !on;
}

function renderGuessLog() {
  const list = $('logList');
  if (!list) return;
  $('logCount').textContent = logRows.length;
  if (!logRows.length) {
    list.innerHTML = `<li class="log-empty">${phase === 'spinning' ? 'The wheel is spinning…' : 'Waiting for the first guess…'}</li>`;
    return;
  }
  list.innerHTML = logRows.map(g => {
    const first = logHighlight && logHighlight.guesser === g.guesser && logHighlight.guess === g.guess;
    const color = WHEEL_COLORS[Math.max(0, ALL_NAMES.indexOf(g.guesser)) % WHEEL_COLORS.length];
    return `<li class="log-item${first ? ' first' : ''}">
      <span class="av" style="background:${color}">${esc(g.guesser.charAt(0))}</span>
      <span class="msg"><b>${esc(g.guesser)}</b> guessed <em>${esc(g.guess)}</em></span>
      ${first ? '<span class="badge">⭐ First!</span>' : ''}
    </li>`;
  }).join('');
  list.scrollTop = list.scrollHeight;
}

// ---------- 60-second guessing timer ----------
function paintTimer(left) {
  const pill = $('roundTimer'), bar = $('timerBar'), fill = $('timerFill');
  if (!pill) return;
  pill.hidden = false; bar.hidden = false;
  pill.textContent = '⏱ ' + fmtClock(left);
  pill.classList.remove('story');
  pill.classList.toggle('urgent', left <= 10);
  fill.style.width = Math.max(0, Math.min(100, left / ROUND_SECONDS * 100)) + '%';
}
function showStoryPill() {
  const pill = $('roundTimer'), bar = $('timerBar');
  if (!pill) return;
  pill.hidden = false; bar.hidden = true;
  pill.textContent = '🎤 Story time';
  pill.classList.remove('urgent');
  pill.classList.add('story');
}
function hideTimer() {
  const pill = $('roundTimer'), bar = $('timerBar');
  if (pill) pill.hidden = true;
  if (bar) bar.hidden = true;
}
function startRoundTimer(startMs) {
  stopRoundTimer();
  const tick = () => {
    const left = Math.max(0, ROUND_SECONDS - (Date.now() - startMs) / 1000);
    paintTimer(left);
    if (left <= 0) {
      stopRoundTimer();
      if (roundIsOpen()) resolveRound(false, null, 'timeout');
    }
  };
  tick();
  if (roundIsOpen()) roundTimerInt = setInterval(tick, 250);
}
function stopRoundTimer() {
  if (roundTimerInt !== null) { clearInterval(roundTimerInt); roundTimerInt = null; }
}

// If the host reloads mid-round, pick the open round back up instead of leaving it stuck.
async function restoreOpenRound() {
  const [{ data: pub }, { data: sec }] = await Promise.all([
    sb.from('ff_round').select('*').eq('id', true).maybeSingle(),
    sb.from('ff_round_secret').select('*').eq('id', true).maybeSingle(),
  ]);
  if (!(pub && pub.status === 'open' && sec && sec.round_id && sec.round_id === pub.round_id)) return;

  const start = roundStartFromId(pub.round_id);
  if (Date.now() - start > (ROUND_SECONDS + 5) * 1000) {
    // Nobody was running the clock for this round, so it can't fairly be scored either way.
    await sb.from('ff_round').update({ status: 'idle', round_id: null, fact_text: null, candidates: [], winner: null, solved_identity: null }).eq('id', true);
    toast("Cleared an unfinished round from earlier. Nothing was scored.");
    return;
  }
  currentRound = { roundId: pub.round_id, activePerson: sec.active_person, factText: sec.fact_text, resolved: false };
  phase = 'guessing';
  logRows = []; logHighlight = null;
  showGuessLog(true);
  $('roundStatus').textContent = "🕵️ Guessing is open!";
  $('roundFact').textContent = `"${sec.fact_text}"`;
  updateSpinButtons();
  watchGuessesForRound(pub.round_id);
  startRoundTimer(start);
}

async function refreshWeekStatus() {
  const [{ data: ws }, { data: mix }] = await Promise.all([
    sb.from('ff_week_status').select('*').eq('id', true).maybeSingle(),
    sb.from('ff_week_mix').select('mapping').eq('id', true).maybeSingle(),
  ]);
  latestWeekStatus = ws
    ? { remaining: ws.remaining || [], solved: ws.solved || [], seed: ws.generated_at || '' }
    : { remaining: [], solved: [], seed: '' };
  latestMix = (mix && mix.mapping) || {};
  drawWheel();
  renderWeekCard();
  updateSpinButtons();
}

async function refreshWinners() {
  const [{ data: stumps }, { data: guessers }] = await Promise.all([
    sb.from('ff_unguessed_prizes').select('*'),
    sb.from('ff_scoreboard').select('*'),
  ]);
  renderWinners(
    (stumps || []).filter(r => r.count > 0).map(r => ({ name: r.name, count: r.count })),
    (guessers || []).filter(r => r.correct_guesses > 0).map(r => ({ name: r.name, correctGuesses: r.correct_guesses }))
  );
}

function buildQr() {
  const url = location.origin + location.pathname;
  const box = $('qrBox');
  box.innerHTML = '';
  new QRCode(box, { text: url, width: 440, height: 440, colorDark: '#180f33', colorLight: '#ffffff' });
  $('qrUrl').textContent = (location.host + location.pathname).replace(/index\.html$/, '');
}

function renderWeekCard() {
  const remaining = latestWeekStatus.remaining;
  const solved = latestWeekStatus.solved;
  const total = remaining.length + solved.length;
  const line = $('weekLine');
  if (!line) return;
  line.textContent = total === 0
    ? "No facts loaded yet — add facts, then shuffle to start a week."
    : `${total} fun facts in play this week`;
  $('weekBar').style.width = total === 0 ? '0%' : `${Math.round((solved.length / total) * 100)}%`;
  $('weekSolved').textContent = `${solved.length} played`;
  $('weekRemaining').textContent = `${remaining.length} left`;
}

function renderLastRound() {
  const el = $('lastRoundLine');
  if (!el) return;
  el.textContent = lastRound
    ? (lastRound.solved
        ? `Last round: ${lastRound.person}'s fact — guessed by ${lastRound.guesser}.`
        : `Last round: ${lastRound.person}'s fact stumped the room — they win a prize.`)
    : '';
}

function renderWinners(stumpRows, guesserRows) {
  const stumpEl = $('stumpList'), guesserEl = $('guesserList');
  if (!stumpEl || !guesserEl) return;

  stumpRows.sort((a, b) => b.count - a.count || a.name.localeCompare(b.name));
  stumpEl.innerHTML = stumpRows.length
    ? stumpRows.map((r, i) => `
        <li class="board-row">
          <span class="rank">${i + 1}</span>
          <span class="who">${esc(r.name)}</span>
          <span class="prize">🎁 × ${r.count}</span>
        </li>`).join('')
    : `<div class="board-empty">Nobody has stumped the room yet.</div>`;

  guesserRows.sort((a, b) => b.correctGuesses - a.correctGuesses || a.name.localeCompare(b.name));
  guesserEl.innerHTML = guesserRows.length
    ? guesserRows.map((r, i) => `
        <li class="board-row">
          <span class="rank">${i + 1}</span>
          <span class="who">${esc(r.name)}</span>
          <span class="score tnum">${r.correctGuesses}</span>
        </li>`).join('')
    : `<div class="board-empty">No correct guesses yet.</div>`;
}

// ---------- the wheel: every slice shows (a shortened) fun fact from this week's rotation ----------
function wrapFact(ctx, text, maxW, maxLines) {
  const words = String(text).trim().split(/\s+/).filter(Boolean);
  const lines = [];
  let cur = '';
  for (const w of words) {
    const test = cur ? cur + ' ' + w : w;
    if (ctx.measureText(test).width <= maxW) cur = test;
    else { if (cur) lines.push(cur); cur = w; }
  }
  if (cur) lines.push(cur);
  if (lines.length > maxLines) {
    lines.length = maxLines;
    lines[maxLines - 1] += '…';
  }
  return lines.map(l => {
    let s = l;
    while (ctx.measureText(s).width > maxW && s.length > 2) s = s.replace(/.(…)?$/, '') + '…';
    return s;
  });
}

function drawWheel() {
  const canvas = $('wheel');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const size = canvas.width, k = size / 600, center = size / 2, radius = center - 6 * k;
  ctx.clearRect(0, 0, size, size);
  const names = orderedRemaining();
  const n = names.length;
  if (!n) return;

  const sliceAngle = (2 * Math.PI) / n;
  const fs = (n <= 4 ? 34 : n <= 8 ? 28 : 23) * k;
  const maxLines = n <= 4 ? 3 : 2;
  const lh = fs * 1.12;
  const outer = radius - 18 * k;
  // keep the text block inside its wedge: the wedge narrows toward the hub
  const rMin = Math.max(radius * 0.3, (lh * maxLines + 8 * k) * n / (2 * Math.PI));
  const maxW = Math.max(60 * k, outer - rMin);

  names.forEach((name, i) => {
    const startAngle = i * sliceAngle, endAngle = startAngle + sliceAngle;
    ctx.beginPath();
    ctx.moveTo(center, center);
    ctx.arc(center, center, radius, startAngle, endAngle);
    ctx.closePath();
    ctx.fillStyle = WHEEL_COLORS[i % WHEEL_COLORS.length];
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.55)';
    ctx.lineWidth = 2 * k;
    ctx.stroke();

    ctx.save();
    ctx.translate(center, center);
    ctx.rotate(startAngle + sliceAngle / 2);
    ctx.textAlign = 'right';
    ctx.fillStyle = '#180f33';
    ctx.font = `700 ${fs}px 'Fredoka', 'Work Sans', sans-serif`;
    const fact = latestMix[name];
    const lines = fact ? wrapFact(ctx, fact, maxW, maxLines) : ['🎉 Fun Fact'];
    const y0 = -((lines.length - 1) * lh) / 2;
    lines.forEach((line, li) => ctx.fillText(line, outer, y0 + li * lh + fs * 0.35));
    ctx.restore();
  });
}

// ---------- a round: spin -> guess (60s) -> story time ----------
async function spinHost() {
  const order = orderedRemaining();
  if (hostSpinning || roundIsOpen() || phase === 'story' || order.length === 0) return;
  hostSpinning = true;
  phase = 'spinning';
  logRows = []; logHighlight = null;
  hideTimer();
  showGuessLog(true);
  renderGuessLog();
  updateSpinButtons();
  $('roundStatus').textContent = "Spinning…";
  $('roundFact').textContent = '';
  Music.unlock(); // must happen inside the click so the browser lets the tune start later

  const canvas = $('wheel');
  canvas.style.transition = 'transform 6s cubic-bezier(.17,.67,.12,.99)';
  void canvas.offsetWidth;

  const sliceAngle = 360 / order.length;
  const winnerIndex = Math.floor(Math.random() * order.length);
  const winnerName = order[winnerIndex];
  const randomOffset = Math.random() * (sliceAngle * 0.8) + sliceAngle * 0.1;
  const targetAngle = (270 - (winnerIndex * sliceAngle + randomOffset) + 3600) % 360;
  const extraSpins = 7 + Math.floor(Math.random() * 3);
  hostCurrentRotation = hostCurrentRotation + extraSpins * 360 + targetAngle - (hostCurrentRotation % 360);
  canvas.style.transform = `rotate(${hostCurrentRotation}deg)`;
  startSpinTicks(canvas, sliceAngle);

  setTimeout(async () => {
    stopSpinTicks();
    Music.ding();
    const { data: mixRow, error } = await sb.from('ff_week_mix').select('mapping').eq('id', true).single();
    if (error || !mixRow) {
      toast("Couldn't load this week's facts — try logging in again.");
      hostSpinning = false; phase = 'idle';
      showGuessLog(false);
      $('roundStatus').textContent = 'Ready when you are.';
      updateSpinButtons();
      return;
    }
    const factText = (mixRow.mapping || {})[winnerName] || '(missing fact text)';
    const roundId = 'r' + Date.now();
    currentRound = { roundId, activePerson: winnerName, factText, resolved: false };

    await sb.from('ff_round_secret').update({ round_id: roundId, active_person: winnerName, fact_text: factText }).eq('id', true);
    await sb.from('ff_round').update({ round_id: roundId, status: 'open', fact_text: factText, candidates: latestWeekStatus.remaining, winner: null, solved_identity: null }).eq('id', true);

    $('roundStatus').textContent = "🕵️ Guessing is open!";
    $('roundFact').textContent = `"${factText}"`;

    hostSpinning = false;
    phase = 'guessing';
    renderGuessLog();
    updateSpinButtons();
    watchGuessesForRound(roundId);
    startRoundTimer(roundStartFromId(roundId));
    Music.start();
  }, 6100);
}

function onNobodyBtn() {
  if (phase === 'story') finishStory();
  else if (roundIsOpen()) resolveRound(false, null, 'manual');
}

function watchGuessesForRound(roundId) {
  if (unsubGuesses) unsubGuesses();
  const ch = sb.channel('guesses-' + roundId)
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'ff_guesses', filter: `round_id=eq.${roundId}` }, () => checkGuesses(roundId))
    .subscribe();
  unsubGuesses = () => sb.removeChannel(ch);
  checkGuesses(roundId);
}

async function checkGuesses(roundId) {
  if (!currentRound || currentRound.roundId !== roundId || currentRound.resolved) return;
  const { data } = await sb.from('ff_guesses').select('*').eq('round_id', roundId);
  logRows = (data || []).slice().sort((a, b) => new Date(a.ts) - new Date(b.ts));
  renderGuessLog();
  let best = null;
  logRows.forEach(g => {
    // The person whose fact it is can't win their own round, however they guess.
    if (g.guesser === currentRound.activePerson || g.guess !== currentRound.activePerson) return;
    if (!best) best = g; // logRows is already in arrival order
  });
  if (best) resolveRound(true, best.guesser, 'correct');
}

async function resolveRound(solved, winnerGuesser, reason) {
  if (!currentRound || currentRound.resolved) return;
  currentRound.resolved = true;
  stopRoundTimer();
  Music.stop();
  if (reason === 'timeout') Music.buzz();
  if (unsubGuesses) { unsubGuesses(); unsubGuesses = null; }
  updateSpinButtons();
  const round = currentRound;

  // one last look at the guesses so the log is complete before they're cleaned up
  const { data: finalGuesses } = await sb.from('ff_guesses').select('*').eq('round_id', round.roundId);
  if (finalGuesses) logRows = finalGuesses.slice().sort((a, b) => new Date(a.ts) - new Date(b.ts));
  logHighlight = solved ? { guesser: winnerGuesser, guess: round.activePerson } : null;
  renderGuessLog();

  const { data: ws } = await sb.from('ff_week_status').select('*').eq('id', true).single();
  const wsRow = ws || { remaining: [], solved: [] };
  // Either way this fun fact is used up: it leaves the wheel for the rest of the week.
  const remaining = (wsRow.remaining || []).filter(n => n !== round.activePerson);
  const solvedList = [...(wsRow.solved || []), round.activePerson];

  if (solved) {
    await sb.from('ff_round').update({ status: 'solved', winner: winnerGuesser, solved_identity: round.activePerson }).eq('id', true);
    await bumpScoreboard(winnerGuesser);
    $('roundStatus').textContent = `🎉 It was ${round.activePerson}! ${winnerGuesser} guessed it first!`;
    launchConfetti();
  } else {
    // Stumped the room: the owner earns a prize, recorded in the hidden host controls only.
    // Their name stays off this shared screen; they'll speak up for their own story.
    await sb.from('ff_round').update({ status: 'closed_unsolved' }).eq('id', true);
    await bumpUnguessed(round.activePerson);
    $('roundStatus').textContent = "😮 Nobody got it! Fun fact owner, share the story if you'd like.";
  }
  $('roundFact').textContent = `"${round.factText}"`;

  await sb.from('ff_week_status').update({ remaining, solved: solvedList }).eq('id', true);
  await sb.from('ff_guesses').delete().eq('round_id', round.roundId);

  lastRound = { person: round.activePerson, fact: round.factText, solved, guesser: winnerGuesser };
  currentRound = null;
  phase = 'story';
  showStoryPill();
  renderLastRound();
  updateSpinButtons();
  await Promise.all([refreshWeekStatus(), refreshWinners()]);
}

// Story time is over: back to the How to play card, ready for the next spin.
function finishStory() {
  if (phase !== 'story') return;
  phase = 'idle';
  hideTimer();
  showGuessLog(false);
  const left = latestWeekStatus.remaining.length;
  $('roundStatus').textContent = left ? 'Ready when you are.' : "🏁 That's every fun fact for this week!";
  $('roundFact').textContent = '';
  updateSpinButtons();
}

async function bumpScoreboard(name) {
  const { data } = await sb.from('ff_scoreboard').select('*').eq('name', name).maybeSingle();
  const correctGuesses = ((data && data.correct_guesses) || 0) + 1;
  await sb.from('ff_scoreboard').upsert({ name, correct_guesses: correctGuesses });
}

async function bumpUnguessed(name) {
  const { data } = await sb.from('ff_unguessed_prizes').select('*').eq('name', name).maybeSingle();
  const count = ((data && data.count) || 0) + 1;
  await sb.from('ff_unguessed_prizes').upsert({ name, count });
  return count;
}

async function shuffleWeek() {
  if ((roundIsOpen() || phase === 'story') && !confirm("A round is still in progress. Shuffling will end it. Continue?")) return;

  const { data: factsRows } = await sb.from('ff_facts').select('*');
  const bank = {};
  (factsRows || []).forEach(r => { bank[r.name] = [r.fact1, r.fact2, r.fact3]; });

  const mapping = {};
  const remaining = [];
  ALL_NAMES.forEach(name => {
    const facts = (bank[name] || []).filter(f => f && f.trim());
    if (!facts.length) return;
    mapping[name] = facts[Math.floor(Math.random() * facts.length)];
    remaining.push(name);
  });
  if (!remaining.length) { toast("Add some fun facts first!"); return; }

  if (unsubGuesses) { unsubGuesses(); unsubGuesses = null; }
  Music.stop();
  stopRoundTimer();
  hideTimer();
  showGuessLog(false);
  currentRound = null; phase = 'idle'; lastRound = null;
  renderLastRound();

  const stamp = new Date().toISOString();
  await sb.from('ff_week_mix').update({ mapping, generated_at: stamp }).eq('id', true);
  await sb.from('ff_week_status').update({ remaining, solved: [], generated_at: stamp }).eq('id', true);
  await sb.from('ff_round').update({ status: 'idle', round_id: null, fact_text: null, candidates: [], winner: null, solved_identity: null }).eq('id', true);

  $('roundStatus').textContent = "This week's mix is ready — spin when you are!";
  $('roundFact').textContent = '';
  updateSpinButtons();
  toast(`Shuffled ${remaining.length} fun facts for this week.`);
}

async function resetWinners() {
  if (!confirm("Clear all winners and prize counts? This can't be undone.")) return;
  const { data } = await sb.from('ff_scoreboard').select('name');
  if (data && data.length) await sb.from('ff_scoreboard').delete().in('name', data.map(r => r.name));
  const { data: up } = await sb.from('ff_unguessed_prizes').select('name');
  if (up && up.length) await sb.from('ff_unguessed_prizes').delete().in('name', up.map(r => r.name));
  await refreshWinners();
  toast("Winners cleared.");
}

async function openEditFacts() {
  const { data: rows } = await sb.from('ff_facts').select('*');
  const bank = {};
  (rows || []).forEach(r => { bank[r.name] = [r.fact1, r.fact2, r.fact3]; });

  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.innerHTML = `
    <div class="edit-card">
      <h2>Fun facts</h2>
      <div class="hint">Everyone submits up to three. It's fine to leave some blank until you collect them — each week's mix picks one at random per person. Don't open this while sharing your screen.</div>
      <div class="edit-scroll" id="factRows"></div>
      <div class="edit-actions">
        <button class="danger-ghost" id="factClear" style="margin-right:auto">Clear all</button>
        <button class="ghost" id="factCancel">Cancel</button>
        <button id="factSave">Save</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  requestAnimationFrame(() => overlay.classList.add('show'));

  const rowsEl = $('factRows');
  ALL_NAMES.forEach((name) => {
    const facts = bank[name] || ['', '', ''];
    const row = document.createElement('div');
    row.className = 'fact-row';
    row.innerHTML = `
      <div class="name">${esc(name)}</div>
      <input type="text" data-name="${esc(name)}" data-idx="0" placeholder="Fun fact #1" value="${esc(facts[0] || '')}">
      <input type="text" data-name="${esc(name)}" data-idx="1" placeholder="Fun fact #2" value="${esc(facts[1] || '')}">
      <input type="text" data-name="${esc(name)}" data-idx="2" placeholder="Fun fact #3" value="${esc(facts[2] || '')}">
    `;
    rowsEl.appendChild(row);
  });

  function close() { overlay.classList.remove('show'); setTimeout(() => overlay.remove(), 250); }
  $('factCancel').addEventListener('click', close);
  $('factClear').addEventListener('click', () => {
    if (confirm("Empty every fun fact box? Nothing is deleted until you press Save.")) rowsEl.querySelectorAll('input').forEach(i => { i.value = ''; });
  });
  $('factSave').addEventListener('click', async () => {
    const upserts = ALL_NAMES.map(name => {
      const inputs = rowsEl.querySelectorAll(`input[data-name="${CSS.escape(name)}"]`);
      const vals = Array.from(inputs).map(inp => inp.value.trim());
      return { name, fact1: vals[0] || '', fact2: vals[1] || '', fact3: vals[2] || '' };
    });
    const { error } = await sb.from('ff_facts').upsert(upserts);
    if (error) { toast("Couldn't save — try logging in again."); return; }
    toast("Fun facts saved.");
    close();
  });
}

/* =====================================================================
   GUEST VIEW — guess only. No leaderboard, nothing that hints at answers.
   ===================================================================== */
function initGuest() {
  document.body.classList.remove('host-mode');
  renderGuest();
  refreshRound();
  trackChannel(sb.channel('guest-round').on('postgres_changes', { event: '*', schema: 'public', table: 'ff_round' }, refreshRound).subscribe());
}

async function refreshRound() {
  const { data } = await sb.from('ff_round').select('*').eq('id', true).maybeSingle();
  guestRound = data ? {
    roundId: data.round_id, status: data.status, factText: data.fact_text,
    candidates: data.candidates || [], winner: data.winner, solvedIdentity: data.solved_identity,
  } : null;
  renderFactBanner();
}

// Guests count down too. It starts from the host's round clock unless this phone's clock is
// wildly different, in which case it just counts from the moment the round appeared.
function syncGuestTimer() {
  const open = guestRound && guestRound.status === 'open';
  if (!open) {
    clearInterval(guestTimerInt); guestTimerInt = null; guestRoundKey = null;
    return;
  }
  if (guestRoundKey !== guestRound.roundId) {
    guestRoundKey = guestRound.roundId;
    const fromId = roundStartFromId(guestRound.roundId);
    const elapsed = (Date.now() - fromId) / 1000;
    guestStartMs = (elapsed >= -3 && elapsed <= ROUND_SECONDS + 3) ? fromId : Date.now();
  }
  if (!guestTimerInt) guestTimerInt = setInterval(paintGuestTimer, 500);
  paintGuestTimer();
}
function paintGuestTimer() {
  const el = $('guestTimer');
  if (!el) return;
  const left = Math.max(0, ROUND_SECONDS - (Date.now() - guestStartMs) / 1000);
  el.textContent = '⏱ ' + fmtClock(left);
  el.classList.toggle('urgent', left <= 10);
}

function renderGuest() {
  const app = $('app');
  app.innerHTML = `
    <div class="top">
      <h1>🕵️ Crew Clues</h1>
      <p>Guess whose fun fact just came up. The first correct guess gets the shout-out!</p>
      <button class="role-switch" id="showHostLoginBtn">Hosting this round? Log in</button>
      <div class="host-login-form" id="hostLoginForm">
        <input type="password" id="passcodeInput" placeholder="Host passcode" autocomplete="current-password">
        <button id="passcodeSubmit">Go</button>
      </div>
    </div>
    <div class="guest-wrap">
      <div class="panel" id="identityPanel"></div>
      <div class="panel fact-banner" id="factBanner"></div>
    </div>
  `;
  renderIdentity();
  renderFactBanner();

  $('showHostLoginBtn').addEventListener('click', () => {
    $('hostLoginForm').classList.toggle('show');
  });
  $('passcodeSubmit').addEventListener('click', async () => {
    const val = $('passcodeInput').value;
    if (!val) return;
    await hostLogin(val);
  });
  $('passcodeInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') $('passcodeSubmit').click();
  });
}

function renderIdentity() {
  const el = $('identityPanel');
  if (!el) return;
  if (myGuestName) {
    el.innerHTML = `<div class="whoami">Playing as <strong>&nbsp;${esc(myGuestName)}</strong><button class="ghost" id="changeId">Change</button></div>`;
    $('changeId').addEventListener('click', () => { myGuestName = null; localStorage.removeItem('ffGuest.myName'); renderGuest(); });
  } else {
    el.innerHTML = `
      <div class="eyebrow">Who are you?</div>
      <div class="identity-row">
        <select id="idSelect" aria-label="Your name">
          <option value="">Pick your name…</option>
          ${ALL_NAMES.map(n => `<option value="${esc(n)}">${esc(n)}</option>`).join('')}
        </select>
        <button id="idGo">Let's go</button>
      </div>
    `;
    $('idGo').addEventListener('click', () => {
      const v = $('idSelect').value;
      if (!v) return;
      myGuestName = v;
      localStorage.setItem('ffGuest.myName', v);
      renderGuest();
    });
  }
}

function renderFactBanner() {
  const el = $('factBanner');
  if (!el) return;
  syncGuestTimer();

  if (!guestRound || !guestRound.status || guestRound.status === 'idle') {
    el.innerHTML = `<div class="empty-note"><div class="big">⏳</div>Waiting for the host to spin the wheel…</div>`;
    return;
  }
  if (guestRound.status === 'solved') {
    el.innerHTML = `
      <div class="reveal">
        <div class="status">🎉 Solved!</div>
        <div class="name">${esc(guestRound.solvedIdentity)}</div>
        <div class="sub">${esc(guestRound.winner)} guessed it first!</div>
        <div class="sub">🎤 Story time — ${esc(guestRound.solvedIdentity)} may share more about it.</div>
      </div>`;
    return;
  }
  if (guestRound.status === 'closed_unsolved') {
    el.innerHTML = `<div class="empty-note"><div class="big">😮</div>Nobody got it! Whoever's fun fact that was may share the story now.</div>`;
    return;
  }

  const timer = `<div class="guest-timer" id="guestTimer"></div>`;

  if (!myGuestName) {
    el.innerHTML = `${timer}<div class="status">🕵️ A fun fact is up for grabs!</div><div class="fact-text">"${esc(guestRound.factText)}"</div><div class="sub">Pick your name above to guess.</div>`;
    paintGuestTimer();
    return;
  }

  const guessedName = localStorage.getItem('ffGuest.guessed.' + guestRound.roundId);
  if (guessedName) {
    el.innerHTML = `
      ${timer}
      <div class="status">🕵️ Guessing is open</div>
      <div class="fact-text">"${esc(guestRound.factText)}"</div>
      <div class="sub">You guessed <strong>${esc(guessedName)}</strong> — waiting to see if you're right!</div>
    `;
    paintGuestTimer();
    return;
  }

  el.innerHTML = `
    ${timer}
    <div class="status">🕵️ Who's it about?</div>
    <div class="fact-text">"${esc(guestRound.factText)}"</div>
    <div class="guess-grid" id="guessGrid" style="margin-top:14px;"></div>
  `;
  const grid = $('guessGrid');
  ALL_NAMES.forEach(name => {
    const btn = document.createElement('button');
    btn.className = 'guess-btn';
    btn.textContent = name;
    btn.addEventListener('click', () => submitGuess(name));
    grid.appendChild(btn);
  });
  paintGuestTimer();
}

async function submitGuess(guessName) {
  if (!guestRound || guestRound.status !== 'open' || !myGuestName) return;
  const roundId = guestRound.roundId;
  if (localStorage.getItem('ffGuest.guessed.' + roundId)) return;
  localStorage.setItem('ffGuest.guessed.' + roundId, guessName);
  renderFactBanner();
  // no timestamp sent: the database stamps it on arrival, so "first" is decided by one clock
  const { error } = await sb.from('ff_guesses').insert({ round_id: roundId, guesser: myGuestName, guess: guessName });
  // 23505 = this person already has a guess in for this round; that one stands.
  if (error && error.code !== '23505') {
    localStorage.removeItem('ffGuest.guessed.' + roundId);
    renderFactBanner();
    toast("Couldn't send your guess — try again.");
  }
}
